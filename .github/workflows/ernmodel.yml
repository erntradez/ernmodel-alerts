name: ernmodel-alerts

on:
  schedule:
    - cron: "2,17,32,47 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ernmodel
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install libraries
        run: pip install yfinance pandas requests

      - name: Check markets and send alerts
        run: python ernmodel_bot.py --once
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Save state
        run: |
          if [ -f state.json ]; then
            git config user.name "ernmodel-bot"
            git config user.email "bot@users.noreply.github.com"
            git add state.json
            git diff --cached --quiet || (git commit -m "update state" && git push)
          fi
